appId: com.jarvis.app
productName: Jarvis
directories:
  output: ../../dist
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
npmRebuild: true
extraResources:
  - from: resources/daemon
    to: daemon
    filter:
      - '**/*'
  - from: ../../packages/core/dist
    to: core
    filter:
      - headless.mjs

win:
  target:
    - target: msi
      arch: [x64]
  artifactName: Jarvis_${version}_x86.${ext}

msi:
  oneClick: false
  perMachine: true

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: Jarvis_${version}_${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
