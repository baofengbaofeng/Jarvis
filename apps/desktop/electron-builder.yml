appId: com.jarvis.app
productName: J.A.R.V.I.S
directories:
  output: ../../dist
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
npmRebuild: true
extraResources:
  - from: resources/daemon
    to: daemon
    filter:
      - '**/*'
  - from: ../../packages/core/dist
    to: core
    filter:
      - headless.mjs
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png

win:
  icon: icon.ico
  target:
    - target: msi
      arch: [x64]
  artifactName: Jarvis_${version}_x86.${ext}

msi:
  oneClick: false
  perMachine: true

mac:
  icon: icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: Jarvis_${version}_${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
